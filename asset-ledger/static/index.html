<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>机房与联网设备台账</title>
  <link rel="stylesheet" href="./static/app.css">
  <link rel="stylesheet" href="./static/device-ports.css">
  <link rel="stylesheet" href="./static/cable-search.css">
  <link rel="stylesheet" href="./static/room-patrol.css">
  <link rel="stylesheet" href="./static/room-profiles.css">
  <link rel="stylesheet" href="./static/rack-planner.css">
  <link rel="stylesheet" href="./static/rack.css">
  <link rel="stylesheet" href="./static/room-overview.css">
  <link rel="stylesheet" href="./static/room-tools.css">
  <link rel="stylesheet" href="./static/pdf-preview.css">
  <script type="module" src="./static/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#page">跳到主要内容</a>
  <main id="login" class="login-screen">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></div>
      <h1 id="login-title">机房与联网设备台账</h1>
      <p id="login-hint" class="muted">登录后查看授权范围内的台账与档案。</p>
      <form id="login-form" class="stack" method="post">
        <label>用户名<input name="username" autocomplete="username" required></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
        <div id="login-captcha" class="login-captcha" hidden>
          <label>图形验证码<input name="captcha" maxlength="4" pattern="[A-Za-z0-9]{4}" autocomplete="off" autocapitalize="characters" spellcheck="false" disabled></label>
          <button id="captcha-refresh" class="captcha-refresh button" type="button" aria-label="换一张图形验证码">
            <img id="captcha-image" width="128" height="48" alt="图形验证码" hidden>
            <span id="captcha-placeholder">获取验证码</span>
          </button>
        </div>
        <p id="login-error" class="form-error" role="alert" hidden></p>
        <button class="button primary" type="submit" disabled>登录</button>
      </form>
    </section>
  </main>

  <div id="workspace" class="workspace" hidden>
    <header class="console-header">
      <div class="header-inner">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></div>
          <strong>联网设备台账</strong>
        </div>
        <nav class="nav" aria-label="主要导航">
          <a href="#rooms" data-route="rooms"><span class="nav-icon" data-icon="rack" aria-hidden="true"><svg viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="6" rx="1.5"/><rect x="3" y="11" width="14" height="6" rx="1.5"/><path d="M6 6h.5M6 14h.5"/></svg></span>机房总览</a>
          <a href="#devices" data-route="devices"><span class="nav-icon" data-icon="devices" aria-hidden="true"><svg viewBox="0 0 20 20"><rect x="2.5" y="4" width="15" height="12" rx="2"/><path d="M3 10h14M6 7h2M6 13h2"/></svg></span>设备台账</a>
          <a href="#systems" data-route="systems"><span class="nav-icon" data-icon="systems" aria-hidden="true"><svg viewBox="0 0 20 20"><rect x="7.5" y="2" width="5" height="5" rx="1"/><rect x="2.5" y="13" width="5" height="4.5" rx="1"/><rect x="12.5" y="13" width="5" height="4.5" rx="1"/><path d="M10 7v3M5 13v-3h10v3"/></svg></span>业务系统</a>
          <a href="#projects" data-route="projects"><span class="nav-icon" data-icon="projects" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M2.5 6V4.5A1.5 1.5 0 0 1 4 3h4l2 2h6A1.5 1.5 0 0 1 17.5 6.5v8A1.5 1.5 0 0 1 16 16H4a1.5 1.5 0 0 1-1.5-1.5V6Z"/></svg></span>项目档案</a>
        </nav>
        <div class="session">
          <details class="account">
            <summary id="scope" class="scope"><span id="account-name"></span><span class="account-role" id="account-role"></span></summary>
            <div id="account-context" class="account-context"></div>
          </details>
          <button id="logout" class="button quiet small" type="button"><svg class="logout-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M8 3.5H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h4M7.5 10h9M13 6.5l3.5 3.5-3.5 3.5"/></svg><span>退出</span></button>
        </div>
      </div>
    </header>
    <div class="workspace-main">
      <div class="topbar">
        <nav id="breadcrumb" class="breadcrumb" aria-label="当前位置" hidden></nav>
      </div>
      <main id="page" class="page" tabindex="-1"></main>
    </div>
  </div>

  <dialog id="drawer" class="drawer" aria-labelledby="drawer-title">
    <div id="drawer-content" class="drawer-content"></div>
  </dialog>
  <dialog id="editor" class="editor" aria-labelledby="editor-title">
    <div id="editor-content" class="editor-content"></div>
  </dialog>
  <dialog id="pdf-preview" class="pdf-preview" aria-labelledby="pdf-title">
    <div id="pdf-content" class="pdf-content"></div>
  </dialog>
  <section id="sroom-update-notice" class="version-update-notice" role="status" aria-live="polite" aria-atomic="true" hidden>
    <span class="version-update-icon" aria-hidden="true">↻</span>
    <div class="version-update-copy">
      <strong>发现新版本，刷新后生效</strong>
      <span id="sroom-update-version" class="muted small-text"></span>
    </div>
    <div class="version-update-actions">
      <button id="sroom-update-refresh" class="button primary small" type="button">刷新更新</button>
      <button id="sroom-update-snooze" class="button quiet small" type="button">稍后提醒</button>
    </div>
  </section>
  <div id="status-message" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
