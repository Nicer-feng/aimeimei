name: Meimei
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
packages:
  MeimeiCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    MARKETING_VERSION: 0.5.0
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Meimei:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: MeimeiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: asia.feng.aimeimei
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_NAME: Meimei
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  MeimeiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Meimei
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: asia.feng.aimeimei.uitests
        GENERATE_INFOPLIST_FILE: YES
  MeimeiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: Meimei
      - package: MeimeiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: asia.feng.aimeimei.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Meimei:
    build:
      targets:
        Meimei: all
    run:
      config: Debug
    test:
      config: Debug
      environmentVariables:
        MEIMEI_OFFLINE_TESTS: '1'
      targets:
        - name: MeimeiTests
          parallelizable: false
        - name: MeimeiUITests
          parallelizable: false
    archive:
      config: Release
