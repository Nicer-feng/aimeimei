name: Android 原生客户端

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'debug 为验证包；release 需要配置长期签名'
        required: true
        default: debug
        type: choice
        options: [debug, release]
  push:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}-${{ inputs.build_type || 'debug' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
      API_BASE_URL: ${{ vars.ANDROID_API_BASE_URL || 'https://feng.asia/' }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Restore release signing
        if: env.BUILD_TYPE == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo '缺少正式签名配置，请先完成 mobile/android/README.md 中的步骤。' >&2
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"
      - name: Test, lint and build APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          task=assembleDebug
          if [ "$BUILD_TYPE" = release ]; then task=assembleRelease; fi
          gradle --no-daemon -p mobile/android -PapiBaseUrl="$API_BASE_URL" :app:testDebugUnitTest :app:lintDebug ":app:$task"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aimeimei-android-${{ env.BUILD_TYPE }}-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/${{ env.BUILD_TYPE }}/*.apk
          retention-days: 7
          if-no-files-found: error
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-${{ github.run_number }}
          path: |
            mobile/android/app/build/reports/tests/
            mobile/android/app/build/reports/lint-results-debug.html
          retention-days: 3
          if-no-files-found: ignore
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/android-release.jks"
