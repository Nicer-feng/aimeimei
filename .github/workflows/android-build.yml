name: Android 原生客户端

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'debug 为验证包；release 需要配置长期签名'
        required: true
        default: debug
        type: choice
        options: [debug, release]
  push:
    branches: [main, 'codex/android-*']
    tags: ['android/v*']
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}-${{ inputs.build_type || 'debug' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUILD_TYPE: ${{ startsWith(github.ref, 'refs/tags/android/v') && 'release' || inputs.build_type || 'debug' }}
      API_BASE_URL: ${{ vars.ANDROID_API_BASE_URL || 'https://feng.asia/' }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Restore release signing
        if: env.BUILD_TYPE == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo '缺少正式签名配置，请先完成 mobile/android/README.md 中的步骤。' >&2
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"
      - name: Test, lint and build APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 -m unittest discover -s mobile/android/scripts/tests -p 'test_*.py'
          task=assembleDebug
          if [ "$BUILD_TYPE" = release ]; then task=assembleRelease; fi
          gradle --no-daemon -p mobile/android -PapiBaseUrl="$API_BASE_URL" :app:testDebugUnitTest :app:lintDebug ":app:$task"
      - name: Verify signed release and prepare update metadata
        if: env.BUILD_TYPE == 'release'
        run: python3 mobile/android/scripts/prepare-release.py mobile/android/app/build/outputs/apk/release
      - name: Check release tag matches APK version
        if: startsWith(github.ref, 'refs/tags/android/v')
        env:
          ANDROID_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          info = json.loads(Path('mobile/android/app/build/outputs/apk/release/update.json').read_text())
          assert os.environ['ANDROID_RELEASE_TAG'] == 'android/v' + info['versionName'], '发布标签与 APK 版本不一致'
          PY
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aimeimei-android-${{ env.BUILD_TYPE }}-${{ github.run_number }}
          path: |
            mobile/android/app/build/outputs/apk/${{ env.BUILD_TYPE }}/*.apk
            mobile/android/app/build/outputs/apk/${{ env.BUILD_TYPE }}/update.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-${{ github.run_number }}
          path: |
            mobile/android/app/build/reports/tests/
            mobile/android/app/build/reports/lint-results-debug.html
          retention-days: 3
          if-no-files-found: ignore
      - name: Upload native UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-previews-${{ github.run_number }}
          path: mobile/android/app/build/reports/native-ui/*.png
          retention-days: 3
          if-no-files-found: ignore
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/android-release.jks"

  publish:
    if: (github.event_name == 'workflow_dispatch' && inputs.build_type == 'release') || startsWith(github.ref, 'refs/tags/android/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aimeimei-android-release-${{ github.run_number }}
          path: dist
      - name: Publish verified Android update
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const info = JSON.parse(fs.readFileSync('dist/update.json', 'utf8'));
            if (!/^\d+\.\d+\.\d+$/.test(info.versionName) || !/^aimeimei-[\d.]+\.apk$/.test(info.apkName)) throw new Error('Invalid release metadata');
            const tag = `android/v${info.versionName}`;
            try {
              await github.rest.repos.getReleaseByTag({...context.repo, tag});
              throw new Error('该版本已经发布，请增加版本号，不覆盖旧安装包');
            } catch (error) { if (error.status !== 404) throw error; }
            const result = await github.rest.repos.createRelease({...context.repo, tag_name: tag,
              target_commitish: context.sha, name: `AI槑槑 Android ${info.versionName}`, draft: true,
              prerelease: false, make_latest: 'false', body: 'Android 原生客户端正式签名安装包。安装需用户确认；请保管长期签名。'});
            for (const name of [info.apkName, 'update.json']) {
              await github.rest.repos.uploadReleaseAsset({...context.repo, release_id: result.data.id, name,
                data: fs.readFileSync(path.join('dist', name)), headers: {'content-type': name.endsWith('.apk') ? 'application/vnd.android.package-archive' : 'application/json'}});
            }
            await github.rest.repos.updateRelease({...context.repo, release_id: result.data.id, draft: false, make_latest: 'false'});
