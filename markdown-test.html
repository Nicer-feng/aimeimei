  <script>
    const preview = document.getElementById("preview");
    preview.innerHTML = window.AIMarkdown.render(document.getElementById("markdownSource").value.trim());
    window.AIMarkdown.enhance(preview);

    document.getElementById("themeToggle").addEventListener("click", (event) => {
      const dark = document.documentElement.dataset.theme !== "dark";
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      event.currentTarget.textContent = dark ? "浅色模式" : "深色模式";
      window.AIMarkdown.rerenderMermaid(preview);
    });
    document.getElementById("viewportToggle").addEventListener("click", (event) => {
      const mobile = document.querySelector(".preview-shell").classList.toggle("is-mobile");
      event.currentTarget.textContent = mobile ? "桌面宽度" : "手机宽度";
      window.AIMarkdown.refreshOverflow(preview);
    });
    document.addEventListener("aimarkdown:image", (event) => {
      document.getElementById("lightboxImage").src = event.detail.src;
      document.getElementById("lightbox").classList.add("show");
    });
    document.getElementById("lightbox").addEventListener("click", (event) => event.currentTarget.classList.remove("show"));
  </script>
