<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>AI槑槑 · 对话分享</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <script src="/res/vendor/markdown-it-14.3.0.min.js"></script>
  <script src="/res/vendor/markdown-it-footnote-4.0.0.min.js"></script>
  <script src="/res/vendor/markdown-it-task-lists-2.1.1.min.js"></script>
  <script src="/res/vendor/dompurify-3.4.12.min.js"></script>
  <script src="/res/vendor/highlight-11.11.1.min.js"></script>
  <script src="/res/vendor/highlight-nginx-11.11.1.min.js"></script>
  <script src="/res/vendor/highlight-dockerfile-11.11.1.min.js"></script>
  <script src="/res/markdown-renderer.js"></script>
  <script defer src="/res/vendor/lucide-1.21.0.min.js"></script>
  <link rel="stylesheet" href="/res/markdown.css?v=2.20.1">
  <link rel="stylesheet" href="/res/share.css?v=2.20.1">
</head>
<body>
  <header class="share-header">
    <a class="share-brand" href="/ai/" aria-label="打开 AI槑槑">
      <img src="/res/meimei-avatar.png" alt="槑槑头像">
      <span><strong>AI槑槑</strong><small>对话分享</small></span>
    </a>
    <span class="share-expiry" id="shareExpiry"><i data-lucide="clock-3"></i><span>读取中</span></span>
  </header>
  <main class="share-main">
    <section class="share-loading" id="shareLoading">
      <img src="/res/meimei-avatar.png" alt="">
      <strong>槑槑正在打开这段对话...</strong>
    </section>
    <section class="share-error" id="shareError" hidden>
      <img src="/res/meimei-avatar.png" alt="">
      <h1>这段分享暂时看不到了</h1>
      <p id="shareErrorText">链接可能已过期或被关闭。</p>
    </section>
    <article class="share-conversation" id="shareConversation" hidden>
      <header class="share-title">
        <span class="share-kicker"><i data-lucide="message-circle-heart"></i>来自 AI槑槑 的对话</span>
        <h1 id="shareTitle"></h1>
        <p id="shareMeta"></p>
      </header>
      <div class="share-messages" id="shareMessages"></div>
      <aside class="share-notice"><i data-lucide="camera"></i><span>这是创建分享时的对话快照，后续聊天不会自动加入。</span></aside>
    </article>
  </main>
  <footer class="share-footer">
    <span>AI槑槑 v2.20.1</span>
    <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">赣ICP备2026013740号</a>
    <a href="https://beian.mps.gov.cn/#/query/webSearch?code=36012202000659" target="_blank" rel="noopener noreferrer">赣公网安备36012202000659号</a>
  </footer>
  <script src="/res/share.js?v=2.20.1"></script>
</body>
</html>
