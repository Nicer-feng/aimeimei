<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>槑槑送礼</title><link rel="icon" href="/favicon.ico"><script src="/res/vendor/tailwindcss-3.4.17.js"></script><script>tailwind.config={corePlugins:{preflight:false}};</script><script defer src="/res/vendor/lucide-1.21.0.min.js"></script><link rel="stylesheet" href="/res/gift/styles.css?v=0.1.0"></head><body>
<header><a href="/ai" class="back" aria-label="返回槑槑"><i data-lucide="arrow-left"></i></a><div><h1>槑槑送礼</h1><p>记住每一份心意，也记住已经送过什么。</p></div><select id="recipient" aria-label="切换收礼对象"></select><button id="newRecipient" class="quiet" title="新增收礼对象" aria-label="新增收礼对象"><i data-lucide="user-plus"></i></button></header>
<nav aria-label="送礼导航"><button data-page="home" class="active"><i data-lucide="house"></i>概览</button><button data-page="history"><i data-lucide="clock"></i>购买历史</button><button data-page="profile"><i data-lucide="baby"></i>宝宝档案</button><button data-page="recommend"><i data-lucide="sparkles"></i>本月送什么</button></nav>
<main id="content" aria-live="polite"><p>正在加载…</p></main><button id="add" class="floating"><i data-lucide="plus"></i>添加商品</button><div id="toast" role="status" hidden></div>
<dialog id="editor" aria-labelledby="editorTitle"><div class="dialog-head"><h2 id="editorTitle">添加商品</h2><button class="quiet" data-close="editor" aria-label="关闭"><i data-lucide="x"></i></button></div><div id="editorBody"></div></dialog>
<dialog id="imageEditor" aria-labelledby="imageTitle"><div class="dialog-head"><h2 id="imageTitle">截图录入</h2><button class="quiet" data-close="imageEditor" aria-label="关闭"><i data-lucide="x"></i></button></div><p class="muted">上传商品或订单截图，核对后再保存。购物车勾选不代表已购买。</p><label class="upload">选择截图，可多选<input type="file" id="screenshots" accept="image/jpeg,image/png,image/webp" multiple></label><label>购买日期（可留空）<input id="draftDate" type="date"></label><label>或仅记录月份<input id="draftMonth" type="month"></label><div id="recognitionStatus" role="status"></div><div id="drafts"></div><button id="saveDrafts" hidden>确认所选商品已购买并保存</button></dialog>
<dialog id="importEditor" aria-labelledby="importTitle"><div class="dialog-head"><h2 id="importTitle">导入旧购物清单</h2><button class="quiet" data-close="importEditor" aria-label="关闭"><i data-lucide="x"></i></button></div><p class="muted">兼容“已购总表＋已购明细”。月份标记与截图分别保存，不推算件数和金额。</p><label class="upload">选择 Excel<input id="excel" type="file" accept=".xlsx"></label><div id="importPreview"></div></dialog>
<dialog id="categoryEditor" aria-labelledby="categoryTitle"><div class="dialog-head"><h2 id="categoryTitle">新增分类</h2><button class="quiet" data-close="categoryEditor" aria-label="关闭">×</button></div><form id="categoryForm"><label>一级分类<input name="level1" required maxlength="100"></label><label>二级分类<input name="level2" required maxlength="100"></label><label>三级分类<input name="level3" required maxlength="100"></label><button type="submit">保存分类</button></form></dialog>
<dialog id="sourceViewer" aria-label="查看原始截图"><div class="dialog-head"><h2>原始截图</h2><button class="quiet" data-close="sourceViewer" aria-label="关闭"><i data-lucide="x"></i></button></div><img id="sourceImage" alt="原始商品或订单截图"></dialog>
<script defer src="/res/gift/app.js?v=0.1.0"></script></body></html>
